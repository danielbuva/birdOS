# Bird fixed RG34XX-SP native RetroArch policy.
input_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
libretro_directory = "/usr/lib/libretro"
system_directory = "/storage/MUOS/bios"
savefile_directory = "/storage/MUOS/Bird/save/files"
savestate_directory = "/storage/MUOS/Bird/save/states"
audio_driver = "alsathread"
audio_device = "hw:0,0"
video_driver = "glcore"
video_context_driver = "kmsdrm"
video_fullscreen = "true"
video_threaded = "false"
config_save_on_exit = "false"
