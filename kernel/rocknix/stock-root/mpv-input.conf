# Bird fixed RG34XX-SP media controls. Dedicated volume keys are system-owned;
# shoulder buttons remain available for fine player-relative volume changes.
# L2/R2 are deliberately unbound: MPV 0.38's SDL layer loses their trigger-up
# event and repeats a speed command indefinitely.
# The fixed H700/SDL path has emitted GAMEPAD_ACTION_RIGHT alongside a physical
# pause press. Override MPV's default for that action so the overlap is
# harmless. Keep audio-track selection on the independent Y action.
GAMEPAD_ACTION_DOWN cycle pause
GAMEPAD_ACTION_RIGHT ignore
GAMEPAD_ACTION_LEFT cycle sub
GAMEPAD_ACTION_UP cycle audio
GAMEPAD_DPAD_LEFT seek -5
GAMEPAD_DPAD_RIGHT seek 5
GAMEPAD_DPAD_DOWN seek -60
GAMEPAD_DPAD_UP seek 60
GAMEPAD_LEFT_SHOULDER add volume -2
GAMEPAD_RIGHT_SHOULDER add volume 2
VOLUME_DOWN ignore
VOLUME_UP ignore
